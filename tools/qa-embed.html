<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterparty embedded-player QA</title><style>body{margin:0;background:#242b40;color:#e9eadb;font:14px system-ui}header{padding:10px;display:flex;gap:10px;align-items:center}iframe{display:block;border:0;margin:auto;width:800px;height:450px}select,button{padding:6px}</style>
<header><label>Player size <select id="size"><option value="800,450">800 × 450</option><option value="640,360">640 × 360</option><option value="1024,600">1024 × 600</option><option value="390,844">390 × 844</option></select></label><label><input id="fullscreen" type="checkbox"> Allow native fullscreen</label><button id="reload">Reload player</button><span>Only the parent test page may scroll; the game must never scroll.</span></header>
<iframe allow="fullscreen 'none'" title="Afterparty test player" src="../index.html"></iframe>
<script>const player=document.querySelector('iframe');function resize(){const [w,h]=document.getElementById('size').value.split(',');player.style.width=w+'px';player.style.height=h+'px';}document.getElementById('size').onchange=resize;document.getElementById('reload').onclick=()=>player.src='../index.html';document.getElementById('fullscreen').onchange=e=>{if(e.target.checked)player.setAttribute('allow','fullscreen');else player.setAttribute('allow',"fullscreen 'none'");player.src='../index.html';};</script></html>
